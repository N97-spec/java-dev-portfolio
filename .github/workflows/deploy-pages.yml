name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build static site
        env:
          # Site is served at https://<user>.github.io/<repo>/
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: bunx vite build

      - name: Prepare Pages folder
        run: |
          # Detect the actual static output directory
          if [ -d dist/client ]; then
            OUT=dist/client
          elif [ -d .output/public ]; then
            OUT=.output/public
          elif [ -d dist ]; then
            OUT=dist
          else
            echo "No build output directory found" >&2
            exit 1
          fi
          echo "Using output directory: $OUT"
          echo "pages_dir=$OUT" >> "$GITHUB_ENV"
          touch "$OUT/.nojekyll"
          cp "$OUT/index.html" "$OUT/404.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.pages_dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
